---
services:
  app:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly_iii_core
    networks:
      - firefly_iii
      - caddy_net
    restart: always
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    env_file: .env
    expose:
      - "8080"
    depends_on:
      - db
  db:
    image: mariadb:lts
    hostname: db
    container_name: firefly_iii_db
    networks:
      - firefly_iii
    restart: always
    env_file: .db.env
    volumes:
      - firefly_iii_db:/var/lib/mysql
  importer:
    image: fireflyiii/data-importer:latest
    hostname: importer
    restart: always
    container_name: firefly_iii_importer
    networks:
      - firefly_iii
      - caddy_net
    expose:
      - "8080"
    depends_on:
      - app
    env_file: .importer.env
  cron:
    image: alpine
    container_name: firefly_iii_cron
    restart: always
    command: sh -c "echo \"0 3 * * * wget -qO-
      http://app:8080/api/v1/cron/REPLACEME;echo\" | crontab - && crond -f -L
      /dev/stdout"
    networks:
      - firefly_iii
volumes:
  firefly_iii_upload: null
  firefly_iii_db: null
networks:
  firefly_iii:
    driver: bridge
  caddy_net:
    name: caddy_net
    external: true

