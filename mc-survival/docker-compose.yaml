# Generated by setupmc.com on 2025-08-14T10:21:26.805Z
# Worldgen stack + merge step added 2026-08-17.
#
# Startup order:
#   mc-setup           itzg SETUP_ONLY -> downloads mods/deps, exits
#   mc-worldgen-merge  reconciles the mods that overwrite the same vanilla
#                      files, writes world/datapacks/zzz-worldgen-merge.zip
#   mc                 starts the server with mods and datapack already in place
#
# The merge must happen before the server loads the world: biome and structure
# data is read at world load, so a datapack written afterwards would not apply
# to chunks generated in between.

x-mc-env: &mc-env
  EULA: "TRUE"
  TYPE: "FABRIC"
  VERSION: "26.2"
  # Box has 3.7Gi total and ~1.3Gi free with the other stacks running, so this
  # stays at the original value. Raising it will get the JVM OOM-killed.
  MEMORY: "2048M"
  MAX_PLAYERS: "2"
  ICON: "https://opengameart.org/sites/default/files/heart%20pixel%20art%20254x\
    254.png"
  USE_AIKAR_FLAGS: "false"
  USE_MEOWICE_FLAGS: "true"
  TZ: "Europe/London"
  DIFFICULTY: "2"
  SPAWN_PROTECTION: "0"
  ENABLE_WHITELIST: "true"
  # MOTD, OPS and WHITELIST come from .env (see .env.template)
  MODRINTH_PROJECTS: |-
    fabric-api
    lithium
    ferrite-core
    journeymap
    chunky
    lithostitched
    terralith
    tectonic
    geophilic
    trek
    nullscape
    amplified-nether
    mns-moogs-nether-structures
    dungeons-and-taverns-nether-fortress-overhaul
  MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
  MODRINTH_ALLOWED_VERSION_TYPE: "beta"
  LOG_TIMESTAMP: "true"

services:
  # Pass 1: resolve and download mods, then exit without starting the server.
  mc-setup:
    image: itzg/minecraft-server:stable
    environment:
      <<: *mc-env
      SETUP_ONLY: "TRUE"
    env_file: .env
    volumes:
      - "/opt/docker/mc-survival:/data"
    restart: "no"

  # Pass 2: merge the worldgen files that several mods each overwrite whole.
  mc-worldgen-merge:
    image: python:3.12-slim
    depends_on:
      mc-setup:
        condition: service_completed_successfully
    environment:
      MC_DATA_DIR: "/data"
    volumes:
      - "/opt/docker/mc-survival:/data"
      - "./mc-worldgen-merge.py:/merge.py:ro"
    command: ["python", "/merge.py", "--data", "/data"]
    restart: "no"

  # Pass 3: the actual server.
  mc:
    image: itzg/minecraft-server:stable
    depends_on:
      mc-worldgen-merge:
        condition: service_completed_successfully
    tty: true
    stdin_open: true
    ports:
      - "100.79.21.111:25565:25565"
      - "100.79.21.111:25575:25575"
    environment:
      <<: *mc-env
    env_file: .env
    volumes:
      - "/opt/docker/mc-survival:/data"
  # Backups are handled entirely by this side-car. It uses RCON to flush the
  # world and pause writes, copies it out, then resumes -- so the copy is never
  # torn mid-write. This replaces the old host cron job
  # (scripts/backup.sh on /opt/minecraft/survival/world), whose source path no
  # longer exists and which tarred the world live with no save-off.
  #
  # On-demand backup:  docker compose exec mc-backup backup now
  # Restore:           see ../RESTORE.md
  mc-backup:
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    environment:
      RCON_HOST: "mc"
      BACKUP_NAME: "mc-survival"
      # rsync stores each backup as a plain directory, so a restore is a plain
      # rsync back -- no unpacking a multi-GB tarball on a box with 1.3Gi free.
      BACKUP_METHOD: "rsync"
      # Daily at 04:00 local. CRON_SCHEDULE overrides BACKUP_INTERVAL,
      # INITIAL_DELAY, BACKUP_ON_STARTUP and PAUSE_IF_NO_PLAYERS.
      CRON_SCHEDULE: "0 4 * * *"
      TZ: "Europe/London"
      # Keep the newest 5 backups; age-based pruning off.
      PRUNE_BACKUPS_DAYS: "0"
      PRUNE_BACKUPS_COUNT: "5"
      # Symlink pointing at the newest backup, for restores.
      LINK_LATEST: "true"
      # Only the world matters; mods and configs are reproducible from mc-setup.
      INCLUDES: world/
    volumes:
      # Must be the same mount as the "mc" service, but can be read-only.
      - /opt/docker/mc-survival:/data:ro
      # Its own subdirectory, not the whole backups/ tree -- PRUNE_BACKUPS_COUNT
      # deletes inside this directory and must not be able to reach the
      # firefly/paperless archives.
      - /home/vova/backups/mc-survival:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
