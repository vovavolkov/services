services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:latest
    restart: always
    network_mode: "host"
    volumes:
      - ./conf:/etc/caddy
      - /var/www/:/srv/:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: ".env"

volumes:
  caddy_data:
  caddy_config:

